name: CI

on:
  push:
    branches: [v2-observe, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The sim tests replay weeks of simulated history through the real ingest
    # pipeline, one small time-local batch at a time (see send.ts for why the batches
    # must stay small). That is ~69,000 SQL round trips per heavy test, so the suite
    # is round-trip bound and a slower runner shows up as minutes, not seconds.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dripmetric
          POSTGRES_PASSWORD: dripmetric
          POSTGRES_DB: dripmetric
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U dripmetric -d dripmetric"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      NODE_ENV: test
      # The app connects as the non-owner role, so RLS applies to it in CI too.
      DATABASE_URL: postgres://dripmetric_app:dripmetric_app@localhost:54329/dripmetric
      ADMIN_DATABASE_URL: postgres://dripmetric:dripmetric@localhost:54329/dripmetric
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-0000000000000000000000
      ENCRYPTION_KEYS: k1:ZGV2LW9ubHktMzItYnl0ZS1rZXktZm9yLWxvY2FsISE=
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This database is thrown away when the job ends, so durability buys nothing
      # and costs a WAL flush on every commit. The sim tests commit ~8,900 times
      # each. Measured locally at 13% off the heaviest test; a CI runner's disk is
      # slower than this container's, so it should be worth more there.
      #
      # `synchronous_commit` is reloadable, which is why it is set here rather than
      # with `fsync=off`: a service container takes docker options, not Postgres
      # ones, and `fsync` needs a restart.
      - name: Make the throwaway database faster
        run: >-
          psql "$ADMIN_DATABASE_URL" -c
          "ALTER DATABASE dripmetric SET synchronous_commit = off"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm licenses` is a pnpm BUILT-IN and silently won over a script of that
      # name, so this step used to run pnpm's own command and never our check.
      # scripts/check-script-names.mjs now fails the build if that can happen again.
      - name: Script names are not shadowed by pnpm built-ins
        run: pnpm check:names

      # Push protection catches a key-shaped string at push time, after the commit
      # is already made. This catches it in CI (and in `pnpm verify`) instead.
      - name: No key-shaped strings in tracked files
        run: pnpm check:fixtures

      # Nothing GPL or AGPL may ship to customers (CLAUDE.md rule 8).
      - name: Licences
        run: pnpm check:licenses

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The SDK build measures the gzipped core and FAILS over 5 KB
      # (brief section 6: "CI enforces the size budgets").
      - name: SDK size budget
        run: pnpm sdk:build

      # The dev container has Chromium pre-installed and points Playwright at it
      # with PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers. A CI runner has neither, so
      # it has to download one — the e2e tests passed locally and failed here for
      # exactly that reason. Chromium only: it is all playwright.config.ts uses.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so bumping Playwright invalidates it by itself
          # rather than silently reusing a browser the new version cannot run.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter dripmetric exec playwright install --with-deps chromium

      # Consent, SPA route changes, beacons and "stays responsive with the network
      # blocked" can only be proven in a real browser.
      - name: Browser SDK tests
        run: pnpm test:e2e

      # M9's exit checks that only a browser can answer: every dashboard module
      # renders from simulator data, and a scan of the RENDERED HTML finds none of a
      # seeded person's email, name or user id on a free project while a paid one
      # shows all three. The script exits non-zero on any finding.
      #
      # The data-access layer has its own scan in packages/db's tests; this is the
      # other half, because a gate that holds in a serializer and leaks in a template
      # has still leaked.
      - name: Dashboard screenshots and masking scan
        run: pnpm screens

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screens
          path: docs/screens/
          if-no-files-found: error
